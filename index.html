<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的財務小天地｜收支與預算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="application/json" id="sayo-db-schema">
      { "collections": [ { "name": "transactions", "label": "收支紀錄", "fields": ["id", "type", "amount", "category", "note", "allocationNote", "date", "month", "authorUserId", "createdAt"] }, { "name": "budgets", "label": "每月預算", "fields": ["id", "month", "category", "amount", "authorUserId", "createdAt"] } ] }
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-emerald-50 via-cyan-50 to-indigo-50 text-slate-900">
    <main class="mx-auto max-w-6xl space-y-6 p-4 sm:p-6 lg:p-8">
      <header class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-emerald-600 via-teal-500 to-cyan-500 p-6 text-white shadow-xl shadow-emerald-900/10 sm:flex-1 sm:p-8">
          <div class="pointer-events-none absolute -right-4 -top-10 text-8xl opacity-20 sm:text-9xl">💰</div>
          <p class="text-sm font-bold uppercase tracking-[0.18em] text-emerald-50">✨ 個人財務小天地</p>
          <h1 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">收支與預算</h1>
          <p class="mt-2 max-w-lg text-emerald-50">每一筆都有記錄，讓理財進度看得見！</p>
        </div>
        <div class="flex flex-wrap items-end gap-3 rounded-2xl border border-white/80 bg-white/90 p-4 shadow-lg shadow-slate-900/5 backdrop-blur">
          <label class="text-sm font-medium">檢視月份
            <input id="monthFilter" type="month" class="mt-1 block rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
          </label>
          <label class="text-sm font-medium">幣別
            <select id="currencySelect" class="mt-1 block rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100">
              <option value="TWD">TWD 新台幣</option><option value="USD">USD 美元</option><option value="HKD" selected>HKD 港幣</option><option value="CNY">CNY 人民幣</option><option value="JPY">JPY 日圓</option>
            </select>
          </label>
        </div>
      </header>

      <p id="statusMessage" role="status" aria-live="polite" class="hidden rounded-xl px-4 py-3 text-sm"></p>
      <button id="retryLoadButton" type="button" class="hidden rounded-lg border border-rose-200 bg-white px-4 py-2 text-sm font-semibold text-rose-800 shadow-sm hover:bg-rose-50 disabled:opacity-60">↻ 重新載入紀錄</button>

      <section class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="本月摘要">
        <article class="rounded-2xl border border-emerald-100 bg-gradient-to-br from-white to-emerald-50 p-4 shadow-md shadow-emerald-900/5 transition hover:-translate-y-0.5 hover:shadow-lg"><p class="text-sm font-semibold text-emerald-800">🌱 本月收入</p><p id="incomeTotal" class="mt-2 text-2xl font-extrabold text-emerald-700">—</p></article>
        <article class="rounded-2xl border border-rose-100 bg-gradient-to-br from-white to-rose-50 p-4 shadow-md shadow-rose-900/5 transition hover:-translate-y-0.5 hover:shadow-lg"><p class="text-sm font-semibold text-rose-800">🛍️ 本月支出</p><p id="expenseTotal" class="mt-2 text-2xl font-extrabold text-rose-700">—</p></article>
        <article class="rounded-2xl border border-sky-100 bg-gradient-to-br from-white to-sky-50 p-4 shadow-md shadow-sky-900/5 transition hover:-translate-y-0.5 hover:shadow-lg"><p class="text-sm font-semibold text-sky-800">🌈 本月結餘</p><p id="balanceTotal" class="mt-2 text-2xl font-extrabold">—</p></article>
        <article class="rounded-2xl border border-indigo-100 bg-gradient-to-br from-white to-indigo-50 p-4 shadow-md shadow-indigo-900/5 transition hover:-translate-y-0.5 hover:shadow-lg"><p class="text-sm font-semibold text-indigo-800">🎯 本月預算額</p><p id="budgetTotal" class="mt-2 text-2xl font-extrabold text-indigo-700">—</p></article>
      </section>

      <div class="grid items-start gap-6 lg:grid-cols-[0.9fr_1.1fr]">
        <div class="space-y-6">
          <section class="rounded-3xl border border-emerald-100 bg-white/95 p-5 shadow-lg shadow-emerald-900/5 sm:p-6">
            <div class="mb-5"><h2 class="text-lg font-extrabold">✍️ 新增收支</h2><p class="mt-1 text-sm text-slate-500">記下一筆收入或支出，讓每一分錢都有跡可循。</p></div>
            <form id="transactionForm" class="space-y-4">
              <div class="grid gap-4 sm:grid-cols-2">
                <label class="text-sm font-medium">類型
                  <select id="transactionType" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100"><option value="expense">支出</option><option value="income">收入</option></select>
                </label>
                <label class="text-sm font-medium">日期
                  <input id="transactionDate" type="date" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
                </label>
              </div>
              <div class="grid gap-4 sm:grid-cols-2">
                <label class="text-sm font-medium">金額
                  <input id="transactionAmount" type="number" min="0.01" step="0.01" required placeholder="例如 250" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
                </label>
                <label class="text-sm font-medium">分類
                  <select id="transactionCategory" required class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100"></select>
                </label>
              </div>
              <div id="incomeAllocationWrap" class="hidden rounded-xl border border-emerald-100 bg-emerald-50/60 p-4">
                <label for="incomeAllocation" class="block text-sm font-semibold text-emerald-900">收入用途／薪金去向（選填）</label>
                <p class="mt-1 text-xs text-emerald-800">記下這筆收入預計如何分配，例如：儲蓄 30%、房租 40%、生活費 30%。</p>
                <input id="incomeAllocation" maxlength="180" placeholder="例如：儲蓄 30%、房租 40%、生活費 30%" class="mt-2 block w-full rounded-lg border border-emerald-200 bg-white px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
              </div>
              <label class="block text-sm font-medium">備註（選填）
                <input id="transactionNote" maxlength="120" placeholder="例如：午餐、薪資" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
              </label>
              <button id="transactionSubmit" type="submit" class="w-full rounded-lg bg-emerald-700 px-4 py-2.5 font-semibold text-white transition hover:bg-emerald-800 disabled:cursor-wait disabled:opacity-60">新增紀錄</button>
            </form>
          </section>

          <section class="rounded-3xl border border-indigo-100 bg-gradient-to-br from-white to-indigo-50/80 p-5 shadow-lg shadow-indigo-900/5 sm:p-6">
            <div class="mb-5"><h2 class="text-lg font-extrabold">🎯 設定每月預算</h2><p class="mt-1 text-sm text-slate-500">預算依分類設定；再次設定會以最新金額為準。</p></div>
            <form id="budgetForm" class="space-y-4">
              <label class="block text-sm font-medium">支出分類
                <select id="budgetCategory" class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100"></select>
              </label>
              <label class="block text-sm font-medium">預算金額
                <input id="budgetAmount" type="number" min="0.01" step="0.01" required placeholder="例如 8000" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
              </label>
              <p id="budgetMonthLabel" class="text-sm text-slate-500"></p>
              <button id="budgetSubmit" type="submit" class="w-full rounded-lg bg-indigo-700 px-4 py-2.5 font-semibold text-white transition hover:bg-indigo-800 disabled:cursor-wait disabled:opacity-60">儲存此分類預算</button>
            </form>
          </section>
        </div>

        <div class="space-y-6">
          <section class="rounded-3xl border border-amber-100 bg-white/95 p-5 shadow-lg shadow-amber-900/5 sm:p-6">
            <div class="flex flex-wrap items-start justify-between gap-2"><div><h2 class="text-lg font-extrabold">📊 預算使用情況</h2><p class="mt-1 text-sm text-slate-500">依所選月份查看各分類支出。</p></div><p id="budgetRemaining" class="text-sm font-semibold text-slate-600"></p></div>
            <div id="budgetList" class="mt-5 space-y-4"></div>
          </section>
          <section class="rounded-3xl border border-cyan-100 bg-white/95 p-5 shadow-lg shadow-cyan-900/5 sm:p-6">
            <div class="flex items-center justify-between gap-3"><div><h2 class="text-lg font-extrabold">🧾 近期紀錄</h2><p class="mt-1 text-sm text-slate-500">顯示所選月份的收支。</p></div><span id="transactionCount" class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600"></span></div>
            <div class="mt-4 grid gap-3 sm:grid-cols-[1fr_9rem]">
              <label class="sr-only" for="recordSearch">搜尋紀錄</label>
              <input id="recordSearch" type="search" placeholder="搜尋備註、分類或日期" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
              <label class="sr-only" for="recordTypeFilter">紀錄類型</label>
              <select id="recordTypeFilter" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100"><option value="all">全部類型</option><option value="income">收入</option><option value="expense">支出</option></select>
            </div>
            <div id="recentList" class="mt-3 divide-y divide-slate-100"></div>
          </section>
        </div>
      </div>
      <footer class="pb-2 text-center text-xs text-slate-500">應用內紀錄無法使用時，會改存此瀏覽器；瀏覽器備份只在目前裝置可用，不會同步到其他裝置。</footer>
    </main>
    <script>
      const expenseCategories = ['餐飲', '交通', '居住', '購物', '娛樂', '醫療', '教育', '帳單', '存錢', '投資', '其他'];
      const incomeCategories = ['薪資', '兼職', '獎金', '投資', '津貼', '其他'];
      const $ = id => document.getElementById(id);
      const now = new Date();
      const monthNow = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const today = `${monthNow}-${String(now.getDate()).padStart(2, '0')}`;
      $('monthFilter').value = monthNow;
      $('transactionDate').value = today;
      let transactions = [], budgets = [], isOwner = false, currency = 'HKD', localMode = false, browserStorageMode = false;
      const localOnlyTransactionIds = new Set(), localOnlyBudgetIds = new Set();
      const currencyNames = { TWD: '新台幣', USD: '美元', HKD: '港幣', CNY: '人民幣', JPY: '日圓' };
      function showStatus(message, kind = 'info') {
        const el = $('statusMessage');
        el.textContent = message;
        el.className = `rounded-xl px-4 py-3 text-sm ${kind === 'error' ? 'bg-rose-50 text-rose-800' : kind === 'success' ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}`;
      }
      function loadErrorText(error) {
        const detail = String(error?.message || error || '').trim();
        return detail ? detail.slice(0, 140) : '資料服務暫時無法連線';
      }
      function formatMoney(value) {
        try { return new Intl.NumberFormat('zh-TW', { style: 'currency', currency, maximumFractionDigits: currency === 'JPY' ? 0 : 2 }).format(Number(value) || 0); }
        catch { return `${currency} ${(Number(value) || 0).toLocaleString()}`; }
      }
      function makeId() { return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
      function addOptions(select, items) {
        select.replaceChildren();
        items.forEach(value => { const option = document.createElement('option'); option.value = value; option.textContent = value; select.appendChild(option); });
      }
      function updateTransactionCategories() {
        const isIncome = $('transactionType').value === 'income';
        addOptions($('transactionCategory'), isIncome ? incomeCategories : expenseCategories);
        $('incomeAllocationWrap').classList.toggle('hidden', !isIncome);
      }
      function latestBudgetsForMonth(month) {
        const latest = new Map();
        budgets.filter(item => item.month === month).forEach(item => {
          const key = String(item.category || '其他');
          const old = latest.get(key);
          if (!old || String(item.createdAt || '') > String(old.createdAt || '')) latest.set(key, item);
        });
        return [...latest.values()];
      }
      function makeDeleteButton(label, handler) {
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = '刪除'; button.setAttribute('aria-label', `刪除${label}`); button.title = `刪除${label}`;
        button.className = 'ml-2 shrink-0 rounded-md bg-rose-50 px-2.5 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-100 focus:outline-none focus:ring-2 focus:ring-rose-300';
        button.addEventListener('click', handler);
        return button;
      }
      function renderAll() {
        const month = $('monthFilter').value || monthNow;
        $('budgetMonthLabel').textContent = `預算月份：${month}（可用上方月份切換）`;
        const monthTransactions = transactions.filter(item => item.month === month);
        const income = monthTransactions.filter(item => item.type === 'income').reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const expenses = monthTransactions.filter(item => item.type === 'expense').reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        const monthBudgets = latestBudgetsForMonth(month);
        const budgetTotal = monthBudgets.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
        $('incomeTotal').textContent = formatMoney(income);
        $('expenseTotal').textContent = formatMoney(expenses);
        $('balanceTotal').textContent = formatMoney(income - expenses);
        $('balanceTotal').className = `mt-2 text-2xl font-bold ${income - expenses < 0 ? 'text-rose-700' : 'text-slate-900'}`;
        $('budgetTotal').textContent = formatMoney(budgetTotal);
        $('budgetRemaining').textContent = budgetTotal ? `預算餘額 ${formatMoney(budgetTotal - expenses)}` : '尚未設定預算';

        const budgetList = $('budgetList');
        budgetList.replaceChildren();
        if (!monthBudgets.length) {
          const empty = document.createElement('p'); empty.className = 'rounded-xl bg-slate-50 p-4 text-sm text-slate-500'; empty.textContent = '這個月還沒有預算。先新增分類預算，就能追蹤使用情況。'; budgetList.appendChild(empty);
        } else {
          monthBudgets.sort((a, b) => String(a.category).localeCompare(String(b.category), 'zh-TW')).forEach(item => {
            const spent = monthTransactions.filter(tx => tx.type === 'expense' && tx.category === item.category).reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const cap = Number(item.amount) || 0, percent = cap > 0 ? Math.min(100, spent / cap * 100) : 0;
            const row = document.createElement('div');
            const top = document.createElement('div'); top.className = 'flex items-center justify-between gap-3';
            const name = document.createElement('span'); name.className = 'font-semibold'; name.textContent = String(item.category || '其他');
            const amounts = document.createElement('span'); amounts.className = `text-sm ${spent > cap ? 'font-semibold text-rose-700' : 'text-slate-600'}`; amounts.textContent = `${formatMoney(spent)} / ${formatMoney(cap)}`;
            top.append(name, amounts);
            const track = document.createElement('div'); track.className = 'mt-2 h-2.5 overflow-hidden rounded-full bg-slate-100';
            const bar = document.createElement('div'); bar.className = `h-full rounded-full ${spent > cap ? 'bg-rose-500' : 'bg-emerald-500'}`; bar.style.width = `${percent}%`; track.appendChild(bar);
            const bottom = document.createElement('div'); bottom.className = 'mt-1 flex items-center justify-between text-xs text-slate-500';
            const status = document.createElement('span'); status.textContent = spent > cap ? `超出 ${formatMoney(spent - cap)}` : `已使用 ${Math.round(cap ? spent / cap * 100 : 0)}%`;
            bottom.appendChild(status);
            if (isOwner) bottom.appendChild(makeDeleteButton('此分類預算', () => deleteBudget(item)));
            row.append(top, track, bottom); budgetList.appendChild(row);
          });
        }

        const list = $('recentList'); list.replaceChildren();
        const query = $('recordSearch').value.trim().toLocaleLowerCase('zh-TW');
        const typeFilter = $('recordTypeFilter').value;
        const sortedTransactions = monthTransactions.filter(item => (typeFilter === 'all' || item.type === typeFilter) && (!query || `${item.note || ''} ${item.category || ''} ${item.allocationNote || ''} ${item.date || ''}`.toLocaleLowerCase('zh-TW').includes(query))).sort((a, b) => `${b.date || ''}${b.createdAt || ''}`.localeCompare(`${a.date || ''}${a.createdAt || ''}`));
        $('transactionCount').textContent = `${sortedTransactions.length} 筆`;
        if (!sortedTransactions.length) {
          const empty = document.createElement('p'); empty.className = 'py-6 text-center text-sm text-slate-500'; empty.textContent = monthTransactions.length ? '找不到符合條件的紀錄，請調整搜尋或類型。' : '這個月尚無收支紀錄。'; list.appendChild(empty);
        } else {
          sortedTransactions.slice(0, 30).forEach(item => {
            const row = document.createElement('div'); row.className = 'flex items-center justify-between gap-3 py-3';
            const info = document.createElement('div'); info.className = 'min-w-0';
            const title = document.createElement('p'); title.className = 'truncate font-medium'; title.textContent = String(item.note || item.category || '未分類');
            const meta = document.createElement('p'); meta.className = 'mt-0.5 whitespace-normal text-xs text-slate-500'; meta.textContent = `${item.date || ''} · ${item.category || '其他'}${item.allocationNote ? ` · 用途：${item.allocationNote}` : ''}`;
            info.append(title, meta);
            const right = document.createElement('div'); right.className = 'flex items-center';
            const amount = document.createElement('span'); amount.className = `whitespace-nowrap font-semibold ${item.type === 'income' ? 'text-emerald-700' : 'text-slate-800'}`; amount.textContent = `${item.type === 'income' ? '+' : '−'}${formatMoney(item.amount)}`;
            right.appendChild(amount);
            if (isOwner) right.appendChild(makeDeleteButton('此筆紀錄', () => deleteTransaction(item)));
            row.append(info, right); list.appendChild(row);
          });
          if (sortedTransactions.length > 30) { const more = document.createElement('p'); more.className = 'pt-2 text-center text-xs text-slate-400'; more.textContent = '僅顯示最近 30 筆'; list.appendChild(more); }
        }
      }
      const writeMessages = { 'too-large': '資料太大，請縮短備註後再試。', 'too-many-items': '紀錄筆數已達上限，無法新增。', 'quota-exceeded': '儲存空間已滿，請稍後再試。', 'rate-limited': '操作太頻繁，請稍候再試。', 'stale-replace': '資料已更新，請重新整理後再試。' };
      function writeError(result) {
        const code = String(result?.code || '').toLowerCase();
        if (['unauthorized', 'unauthenticated'].includes(code)) return '登入狀態無效，請重新登入後再儲存。';
        if (['forbidden', 'read-only', 'readonly', 'permission-denied'].includes(code)) return '目前無法寫入這份資料，請確認帳戶權限。';
        return writeMessages[code] || result?.error || '儲存失敗，請稍後再試。';
      }
      async function waitForRecordService(timeoutMs = 6000) {
        const started = Date.now();
        while (Date.now() - started < timeoutMs) {
          const db = window.sayoDb;
          if (db && typeof db.getUserId === 'function' && typeof db.append === 'function' && (typeof db.getAll === 'function' || typeof db.get === 'function')) return db;
          await new Promise(resolve => setTimeout(resolve, 150));
        }
        throw new Error('記錄服務未連接');
      }
      function thrownSaveError(error) {
        const code = String(error?.code || '').toLowerCase();
        const detail = String(error?.message || '').toLowerCase();
        if (['unauthorized', 'unauthenticated'].includes(code) || /unauthori[sz]ed|unauthenticated|sign.?in/.test(detail)) return '登入狀態無效，請重新登入後再儲存。';
        if (/forbidden|read.?only|permission denied/.test(detail)) return '目前無法寫入這份資料，請確認帳戶權限。';
        if (/network|fetch|timeout|connection/.test(detail)) return '網路連線不穩，請檢查連線後重試。';
        if (/記錄服務未連接/.test(detail)) return '記錄功能尚未連接。請從已儲存的應用重新開啟；若仍無法使用，請確認此應用已啟用紀錄儲存。';
        return '儲存未完成，表單內容已保留；請稍後重試。';
      }
      async function getLocalItem(key) {
        try {
          const value = await window.sayoStorage.getItem(key);
          if (value !== null && value !== undefined) return value;
        } catch (error) { console.warn('應用儲存服務讀取失敗，改用瀏覽器儲存', error); }
        try {
          const value = localStorage.getItem(key);
          if (value !== null) browserStorageMode = true;
          return value;
        } catch (error) { console.error('瀏覽器本機儲存讀取失敗', error); throw error; }
      }
      async function setLocalItem(key, value) {
        if (!browserStorageMode) {
          try { await window.sayoStorage.setItem(key, value); return; }
          catch (error) { console.warn('應用儲存服務寫入失敗，改用瀏覽器儲存', error); }
        }
        try { localStorage.setItem(key, value); browserStorageMode = true; }
        catch (error) { console.error('瀏覽器本機儲存寫入失敗', error); throw error; }
      }
      async function saveRecord(collection, item, button) {
        button.disabled = true; button.textContent = '儲存中…';
        try {
          if (!localMode) {
            try {
              const db = window.sayoDb;
              if (!db || typeof db.append !== 'function' || typeof db.getUserId !== 'function') throw new Error('應用內紀錄服務未連接');
              item.authorUserId = await db.getUserId();
              if (!item.authorUserId) throw new Error('登入狀態無效');
              const result = await db.append(collection, item);
              if (!result || !result.ok) throw new Error(writeError(result || {}));
              return true;
            } catch (error) { console.error('應用內儲存失敗，改用此瀏覽器', error); }
          }
          const current = collection === 'transactions' ? transactions : budgets;
          await setLocalItem(`finance_${collection}`, JSON.stringify([...current, item]));
          localMode = true; isOwner = true;
          showStatus('應用內儲存未能使用，紀錄已改存此瀏覽器；不會同步到其他裝置。', 'info');
          return true;
        } catch (error) { console.error('收支紀錄儲存失敗', error); showStatus('儲存失敗，表單內容已保留；請檢查瀏覽器儲存空間後重試。', 'error'); return false; }
        finally { button.disabled = false; button.textContent = collection === 'transactions' ? '新增紀錄' : '儲存此分類預算'; }
      }
      async function deleteTransaction(item) {
        if (!confirm('確定刪除此筆收支紀錄？')) return;
        try {
          if (localMode || localOnlyTransactionIds.has(item.id)) {
            const stored = await readLocalRecords('transactions');
            await setLocalItem('finance_transactions', JSON.stringify(stored.filter(tx => tx.id !== item.id)));
            localOnlyTransactionIds.delete(item.id);
            transactions = transactions.filter(tx => tx.id !== item.id); renderAll(); showStatus('紀錄已刪除。', 'success'); return;
          }
          const result = await window.sayoDb.adminDelete('transactions', item.id, item.authorUserId);
          if (result && result.ok === false) { showStatus(writeError(result), 'error'); return; }
          transactions = transactions.filter(tx => tx.id !== item.id); renderAll(); showStatus('紀錄已刪除。', 'success');
        } catch (error) { console.error('刪除收支紀錄失敗', error); showStatus('刪除失敗，請稍後再試。', 'error'); }
      }
      async function deleteBudget(item) {
        if (!confirm('確定刪除此分類預算？')) return;
        try {
          if (localMode || localOnlyBudgetIds.has(item.id)) {
            const stored = await readLocalRecords('budgets');
            await setLocalItem('finance_budgets', JSON.stringify(stored.filter(entry => entry.id !== item.id)));
            localOnlyBudgetIds.delete(item.id);
            budgets = budgets.filter(entry => entry.id !== item.id); renderAll(); showStatus('預算已刪除。', 'success'); return;
          }
          const result = await window.sayoDb.adminDelete('budgets', item.id, item.authorUserId);
          if (result && result.ok === false) { showStatus(writeError(result), 'error'); return; }
          budgets = budgets.filter(entry => entry.id !== item.id); renderAll(); showStatus('預算已刪除。', 'success');
        } catch (error) { console.error('刪除預算失敗', error); showStatus('刪除失敗，請稍後再試。', 'error'); }
      }
      $('transactionType').addEventListener('change', updateTransactionCategories);
      $('monthFilter').addEventListener('change', renderAll);
      $('recordSearch').addEventListener('input', renderAll);
      $('recordTypeFilter').addEventListener('change', renderAll);
      $('transactionForm').addEventListener('submit', async event => {
        event.preventDefault();
        const date = $('transactionDate').value, amount = Number($('transactionAmount').value);
        if (!date || !Number.isFinite(amount) || amount <= 0) { showStatus('請輸入有效日期與大於 0 的金額。', 'error'); return; }
        const type = $('transactionType').value;
        const item = { id: makeId(), type, amount, category: $('transactionCategory').value, note: $('transactionNote').value.trim(), allocationNote: type === 'income' ? $('incomeAllocation').value.trim() : '', date, month: date.slice(0, 7), createdAt: new Date().toISOString() };
        const button = $('transactionSubmit');
        if (await saveRecord('transactions', item, button)) {
          transactions.push(item); $('monthFilter').value = item.month; $('transactionAmount').value = ''; $('transactionNote').value = ''; $('incomeAllocation').value = ''; renderAll(); showStatus(localMode ? '收支紀錄已儲存在此裝置；不會同步。' : '收支紀錄已儲存。', 'success');
        }
      });
      $('budgetForm').addEventListener('submit', async event => {
        event.preventDefault();
        const amount = Number($('budgetAmount').value), month = $('monthFilter').value || monthNow;
        if (!Number.isFinite(amount) || amount <= 0) { showStatus('請輸入大於 0 的預算金額。', 'error'); return; }
        const item = { id: makeId(), month, category: $('budgetCategory').value, amount, createdAt: new Date().toISOString() };
        if (await saveRecord('budgets', item, $('budgetSubmit'))) {
          budgets.push(item); $('budgetAmount').value = ''; renderAll(); showStatus(localMode ? '分類預算已儲存在此裝置；不會同步。' : '分類預算已儲存。', 'success');
        }
      });
      $('currencySelect').addEventListener('change', async event => {
        currency = event.target.value; renderAll();
        try { await setLocalItem('financeCurrency', currency); showStatus(`幣別已切換為${currencyNames[currency]}。`, 'success'); }
        catch (error) { console.error('儲存幣別設定失敗', error); showStatus('幣別已切換，但儲存失敗；請檢查瀏覽器儲存空間設定。', 'error'); }
      });
      async function readAllRecords(collection) {
        const db = window.sayoDb;
        if (!db) throw new Error('資料服務尚未就緒');
        if (typeof db.getAll === 'function') return await db.getAll(collection);
        if (typeof db.get !== 'function') throw new Error('資料服務尚未就緒');
        const all = [];
        let page = await db.get(collection);
        if (!Array.isArray(page)) throw new Error(`無法讀取${collection}資料`);
        all.push(...page);
        while (page.hasMore && page.nextCursor) {
          page = await db.get(collection, { cursor: page.nextCursor });
          if (!Array.isArray(page)) throw new Error(`無法讀取${collection}資料`);
          all.push(...page);
        }
        return all;
      }
      async function readLocalRecords(collection) {
        const raw = await getLocalItem(`finance_${collection}`);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) throw new Error('本機紀錄格式不正確');
        return parsed;
      }
      async function init() {
        updateTransactionCategories(); addOptions($('budgetCategory'), expenseCategories);
        renderAll();
        let loadIssue = '';
        try {
          const db = window.sayoDb;
          if (!db || (typeof db.getAll !== 'function' && typeof db.get !== 'function')) throw new Error('應用內紀錄服務未連接');
          const [savedTransactions, savedBudgets] = await Promise.all([readAllRecords('transactions'), readAllRecords('budgets')]);
          if (!Array.isArray(savedTransactions) || !Array.isArray(savedBudgets)) throw new Error('紀錄格式不正確');
          transactions = savedTransactions; budgets = savedBudgets; localMode = false;
          try { isOwner = typeof db.isOwner === 'function' ? await db.isOwner() : false; }
          catch (error) { console.error('確認管理權限失敗', error); isOwner = false; }
        } catch (error) {
          console.info('應用內紀錄服務無法使用，改用此瀏覽器儲存', error);
          localMode = true; isOwner = true; localOnlyTransactionIds.clear(); localOnlyBudgetIds.clear();
          try { [transactions, budgets] = await Promise.all([readLocalRecords('transactions'), readLocalRecords('budgets')]); }
          catch (localError) { console.error('載入瀏覽器紀錄失敗', localError); transactions = []; budgets = []; loadIssue = '無法讀取此瀏覽器的紀錄，請檢查儲存空間設定。'; }
        }
        try {
          const savedCurrency = await getLocalItem('financeCurrency');
          if (['TWD', 'USD', 'HKD', 'CNY', 'JPY'].includes(savedCurrency)) { currency = savedCurrency; $('currencySelect').value = currency; }
        } catch (error) { console.error('載入幣別設定失敗', error); }
        renderAll();
        const retryButton = $('retryLoadButton');
        if (localMode || loadIssue) { retryButton.classList.remove('hidden'); retryButton.textContent = '↻ 重試應用內儲存'; }
        else retryButton.classList.add('hidden');
        if (loadIssue) showStatus(loadIssue, 'error');
        else if (localMode) showStatus('應用內儲存未能使用，紀錄改存在此瀏覽器；不會同步到其他裝置。', 'info');
        else showStatus('紀錄已儲存在應用內。', 'success');
      }
      $('retryLoadButton').addEventListener('click', async () => {
        const button = $('retryLoadButton');
        button.disabled = true; button.textContent = '載入中…';
        try { await init(); }
        finally { button.disabled = false; if (!button.classList.contains('hidden')) button.textContent = '↻ 重試應用內儲存'; }
      });
      init();
    </script>
  </body>
</html>
